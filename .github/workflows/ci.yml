name: CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          uv run pytest src/backend/ \
            --ignore=src/backend/tests/test_llm_extraction.py \
            --ignore=src/backend/tests/test_e2e_extraction.py \
            -v

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies (for Prettier)
        working-directory: .
        run: npm ci

      - name: Check Formatting (Prettier)
        working-directory: .
        run: npm run format:check || (npx prettier --list-different . && exit 1)
