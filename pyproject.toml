[project]
name = "axiom"
version = "0.1.0"
description = "Axiom: Enterprise Meeting Protocol (DX-OS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "sqlalchemy>=2.0.29",
    "pydantic>=2.7.0",
    "uvicorn>=0.29.0",
    "livekit-api>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "black>=24.4.0",
    "flake8>=7.0.0",
    "isort>=5.13.2",
    "pre-commit>=3.7.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]
