[project]
name = "axiom"
version = "0.1.0"
description = "Axiom: Enterprise Meeting Protocol (DX-OS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "sqlalchemy>=2.0.29",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "alembic>=1.13.0",
    "livekit-api>=0.6.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.12",
    "livekit-agents>=1.7.0",
    "livekit-plugins-openai>=1.7.0",
    "livekit-plugins-silero>=1.7.0",
]

[project.optional-dependencies]
ai = [
    "numpy>=1.26.0",
    "faster-whisper>=1.2.1",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "black>=24.4.0",
    "flake8>=7.0.0",
    "isort>=5.13.2",
    "pre-commit>=3.7.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.pyright]
include = ["src"]
extraPaths = ["."]

[tool.pyrefly]
exclude = ["docs/", "*.md"]
