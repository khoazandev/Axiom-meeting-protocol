# ─── Axiom: Enterprise Meeting Protocol ─────────────────────────
# Full-stack development environment
# Usage: docker-compose up

services:
  # ─── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: axiom
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom_dev_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U axiom' ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      - '8001:8000'
      - '8765:8765' # STT WebSocket
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: postgresql://axiom:axiom_dev_password@postgres:5432/axiom
      CORS_ORIGINS: http://localhost:3000
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL: ws://livekit:7880
      # Ollama / LLM (host.docker.internal = host machine from inside Docker)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # AI Action Item Extraction
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-qwen3:0.6b}
      EXTRACTION_TIMEOUT: ${EXTRACTION_TIMEOUT:-900}
      # Follow-up Task Extraction
      TASK_EXTRACTOR_MODEL: ${TASK_EXTRACTOR_MODEL:-lamphat03102004/task-extractor01}
      TASK_EXTRACTOR_TIMEOUT: ${TASK_EXTRACTOR_TIMEOUT:-900}
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Next.js Frontend ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      NEXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  # ─── LiveKit Server ──────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - '7880:7880' # WebSocket
      - '7881:7881' # HTTP API
      - '7882:7882/udp' # WebRTC UDP
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}'
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}

  # ─── Babel Fish Agent (LiveKit Worker) ─────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - livekit
    command: uv run python -m src.backend.agent start


  # ─── Redis (for future AI queue pipeline) ────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '16379:6379'
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
